# World where bases spawn, world border is applied, and schematic pastes run (must match a multiverse world name)
world-name: Havoc

# SaberFactions tag for Havoc base claims (created automatically as a permanent faction if missing)
havoc-faction-tag: Havoc

# World border is centered at 0,0 with total edge length = 2 * border-half-size (default 5000 => +/- 2500)
border-half-size: 2500

# How many active bases to keep per difficulty (respawns after one is fully restored)
bases-per-difficulty:
  EASY: 3
  MEDIUM: 2
  HARD: 1

# Minimum chunk Chebyshev distance between center chunks, plus each base's schematic chunk radius
min-center-separation-chunks: 20

# Broadcast [Havoc] ... to the whole server for spawn/breach/restore/disable (very noisy on purpose)
debug-broadcast-game: false

timers:
  maintainer-initial-delay-ticks: 40
  maintainer-period-ticks: 200
  restore-ticker-period-ticks: 1
  spawn-worker-period-ticks: 1
  lock-notify-cooldown-ms: 1500
  progression-reset-timezone: "America/New_York"

# Chunks around each base (Manhattan radius from each base chunk) snapshotted at breach for later reset
watch-chunk-radius: 5

# Wall breach: TNT/explosion or break must touch these materials in the CENTER chunk column (middle of 3x3)
breach-materials:
  - OBSIDIAN
  - STATIONARY_WATER
  - WATER

# Seconds until base blocks are fully restored and satellite chunks reset / unclaimed
restore-seconds: 120

placement:
  spawn-max-attempts: 80
  spawn-border-padding-blocks: 32
  spawn-search-attempts-per-tick: 2
  min-base-separation-blocks: 500
  min-origin-distance-blocks: 500

performance:
  spawn-preload-chunks-per-tick: 8
  spawn-snapshot-columns-per-tick: 8
  spawn-paste-columns-per-tick: 4
  spawn-claim-chunks-per-tick: 6

logs:
  # Keep at most this many newest log lines in havoc-logs.log.
  max-log-lines: 100000
  # Drop entries older than this many days.
  max-log-days: 30
  # When retention trims logs, archive the previous file first.
  archive-on-rotate: true

admin-actions:
  spawn:
    cooldown-ms: 3000
    require-confirmation: true
    confirm-window-ms: 5000
  force-restore:
    cooldown-ms: 3000
    require-confirmation: true
    confirm-window-ms: 5000

database:
  # When true, salvage/progression data is persisted in MySQL instead of salvage.yml/progression.yml.
  enabled: false
  host: 127.0.0.1
  port: 3306
  name: havoc
  username: root
  password: ""
  use-ssl: false

# When USE_CONFIG_Y: world Y of obsidian column uses paste-center-world-y and schematic-center-from-min dy.
# When SNAP_BOTTOM_TO_BEDROCK (default): paste Y is chosen so the lowest non-air schematic row (full traverse) sits
# directly above bedrock at the chunk center column (chunk*16+8), ignoring paste-center-world-y for vertical placement.
vertical-paste-mode: SNAP_BOTTOM_TO_BEDROCK

# Only used when vertical-paste-mode is USE_CONFIG_Y (or bedrock column has no bedrock). Falls back to paste-floor-y in older configs.
paste-center-world-y: 64

# From schematic minimum corner (clipboard 0,0,0) to the obsidian column center block (dx,dy,dz).
# Horizontal world position of that block = chunk*16 + chunk-center-local-xz (below).
schematic-center-from-min:
  EASY: "8,0,8"
  MEDIUM: "8,0,8"
  HARD: "8,0,8"

# Local block coordinates (0..15) inside the spawn chunk where the obsidian anchor sits. Default 6,6 matches common
# "chunk center" better than 8,8 for many bases; set "8,8" if your schematic was authored for that anchor.
chunk-center-local-xz: "6,6"

# Legacy: only used by SchematicService.paste (not Havoc base spawning). Bases use block-by-block placement at clipboard (0,0,0).
worldedit-schematic-offset-add: true

# Only the middle value (Y) is applied when spawning bases. X/Z are ignored so horizontal alignment uses chunk-center-local-xz only.
schematic-paste-extra-world-delta: "0,0,0"

# Folder under the plugin data folder containing .schematic files
schematics-folder: schematics

# When set to a path relative to schematics-folder, that file overrides easy/medium/hard-schematic for spawning.
# Updated automatically when an admin saves from /havoc admin bases.
generated-schematics:
  EASY: ""
  MEDIUM: ""
  HARD: ""

# Procedural base generator (wall templates). Used when exporting from /havoc admin bases.
base-generator:
  wall-height-blocks: 22
  max-editor-sections: 24
  max-repeat-per-section: 12

easy-schematic: EasyBase.schematic
medium-schematic: MediumBase.schematic
hard-schematic: HardBase.schematic

salvage-reward:
  EASY_MIN: 15
  EASY_MAX: 45
  MEDIUM_MIN: 40
  MEDIUM_MAX: 120
  HARD_MIN: 100
  HARD_MAX: 300

# Players within this radius (blocks) of the breach block get rewards / progression
reward-radius: 32

# Where raiders inside the Havoc claim get sent
spawn:
  world: Havoc
  x: 0.5
  y: 64.0
  z: 0.5

# Shop UI is configured in shop.yml
